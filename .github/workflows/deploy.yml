# Deploy Flight Ops web game to GitHub Pages.
# Runs on every push to main. Produces a permanent URL at:
#   https://ojasvigoel598.github.io/FlightOps/
#
# NO API keys needed. NO paid services. Works forever.
#
# SETUP (one-time):
#   1. Go to https://github.com/ojasvigoel598/FlightOps/settings/pages
#   2. Under "Source", select "Deploy from a branch"
#   3. Under "Branch", select "gh-pages" / "/ (root)"
#   4. Click Save

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export Expo web
        run: npx expo export --platform web

      - name: Build landing page and copy play pages
        run: |
          # Replace the broken Expo root with a working landing page
          # that has QR codes, play button, and feature highlights
          rm -f dist/index.html
          cp PLAY.html dist/index.html
          cp PLAY.html dist/PLAY.html 2>/dev/null || true
          cp RUN_ANYWHERE.html dist/RUN_ANYWHERE.html 2>/dev/null || true

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: false
